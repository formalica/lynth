name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Run lynth tests (incl. `#print axioms` checks)
        run: |
          lake env lean Test/Sat.lean
          lake env lean Test/Encode.lean
          lake env lean Test/Tactics.lean
          lake env lean Test/Witness.lean
          lake env lean Test/Euf.lean
          lake env lean Test/Arith.lean
          lake env lean Test/ArithTactics.lean
          lake env lean Test/Spec.lean
          lake env lean Test/Robust.lean
          lake env lean Test/Cdcl.lean
          lake env lean Test/CdclFuzz.lean
          lake env lean Test/Ring.lean
          lake env lean Test/Corpus.lean
          lake env lean Test/Simplex.lean
          lake env lean Test/BranchBound.lean
          lake env lean Test/Farkas.lean
          lake env lean Test/Tseitin.lean
          lake env lean Test/Readme.lean
          lake env lean Test/FarkasSound.lean
          lake env lean Test/Nlin.lean
          lake env lean Test/Quant.lean
          lake env lean Test/Arrays.lean
          lake env lean Test/Datatypes.lean
      - uses: leanprover-community/docgen-action@v1
