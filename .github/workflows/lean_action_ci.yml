name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      # `Test.lean` (module `Test`) imports every currently-passing test, and
      # `lake build Test` compiles the whole `Test` library -- the per-directory
      # aggregators (`Test/FinDomain.lean`, `Test/IntervalArith.lean`,
      # `Test/Sat/Suite.lean`, ...) included.  This replaces a hardcoded
      # per-file list, which went stale as tests moved into subdirectories and
      # silently stopped checking most of the suite.
      #
      # Building the library rather than shelling out to `lake env lean` per file
      # also matters: Lake only applies the package's `leanOptions` (including
      # `weak.linter.mathlibStandardSet`, whose header linter can legitimately
      # put a warning inside a `#guard_msgs`) to modules it builds itself.
      #
      # Failing tests live in `TestFailures/`, which is deliberately not a
      # library; inspect those with `lake env lean TestFailures/<path>`.
      - name: Run passing tests (incl. `#print axioms` checks)
        run: |
          lake build Test
      - uses: leanprover-community/docgen-action@v1
