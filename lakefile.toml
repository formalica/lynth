name = "lynth"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Lynth"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

# The `Equiv` corpus: alternative definitions of `Nat`/`List` functions under
# `Scripts/Test/Equiv`.  Declared as a library so the proof files under
# `List/Proofs/` can `import` the definitions instead of copying them.
#
# The globs name `Scripts.Test.Equiv.Nat.+` and `Scripts.Test.Equiv.List.+`,
# i.e. each of those two subtrees and everything below it.  The `+` suffix
# excludes `Scripts.Test.Equiv` itself from the library.
#
# Not listed in `defaultTargets`, so a plain `lake build` still builds only
# `Lynth`.  Build this one explicitly with `lake build EquivCorpus`.
[[lean_lib]]
name = "EquivCorpus"
globs = ["Scripts.Test.Equiv.Nat.+", "Scripts.Test.Equiv.List.+"]

[[lean_lib]]
name = "Lynth"
# Native precompilation: tactic execution (notably the SAT solver hot
# loop) runs ~100x faster natively than interpreted from oleans.
# Without this, `lake env lean` elaboration of solver-heavy goals
# (e.g. 9x9 Sudoku) is dominated by interpreter overhead, dwarfing
# all algorithmic differences.
precompileModules = true
